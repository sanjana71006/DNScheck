version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: dnscheck-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - dnscheck-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dnscheck-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/dnscheck
      - FRONTEND_URL=http://localhost:3000
      - DNS_QUERY_TIMEOUT_MS=3500
      - DNS_MAX_CONCURRENCY=12
      - CACHE_ENABLED=true
      - CACHE_TTL_SECONDS=60
      - GLOBAL_RATE_LIMIT=120
      - SCAN_RATE_LIMIT_PER_MINUTE=30
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - dnscheck-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: dnscheck-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - dnscheck-network

volumes:
  mongo_data:

networks:
  dnscheck-network:
    driver: bridge
